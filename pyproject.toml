[project]
name = "spacetime"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "av>=16.0.1",
    "imageio>=2.37.2",
    "ipykernel>=7.1.0",
    "jupyter>=1.1.1",
    "lightning>=2.5.6",
    "lpips>=0.1.4",
    "matplotlib>=3.10.8",
    "procgen>=0.10.7",
    "torch>=2.7.1",
    "torchvision>=0.22.1",
    "tyro>=1.0.3",
    "wandb[media]>=0.23.0",
]

[tool.flake8]
max-line-length = 120
ignore = ["E501", "E203"]

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spacetime"]
